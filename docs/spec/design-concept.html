<script>
'use strict';
const $=selector=>document.querySelector(selector);
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'security',offline:false,messages:{},drafts:{},theme:'day',detail:null,detailTab:'evidence'};
const people={mira:{name:'Mira',letter:'M',role:'Platform engineer',provider:'Codex',rooms:['Engineering','Security'],desc:'Builds the foundation, follows the edges, and leaves the next person a clear path.',status:'Atlas fix complete'},oren:{name:'Oren',letter:'O',role:'Security engineer',provider:'Claude Code',rooms:['Security'],desc:'Looks for the assumption that could break. Reviews risks with concrete evidence.',status:'Review complete'},pip:{name:'Pip',letter:'P',role:'Reverse engineer',provider:'Cursor',rooms:['Engineering','Reverse engineering'],desc:'Makes unfamiliar systems understandable, one trace and useful diagram at a time.',status:'Tracing Beacon requests'}};
const rooms={security:{name:'Security',subtitle:'Small details. Strong foundations.',people:['mira','oren'],project:'Atlas'},engineering:{name:'Engineering',subtitle:'Build it, understand it, make it better.',people:['mira','pip'],project:'Atlas + Beacon'},reverse:{name:'Reverse engineering',subtitle:'Follow the path. Explain what is really happening.',people:['pip'],project:'Beacon'}};
function avatar(id,small=false){const p=people[id];return `<span class="avatar ${id}${small?' small':''}" aria-hidden="true">${p?p.letter:'B'}</span>`;}
function tag(text,type=''){return `<span class="tag ${type}">${type==='ready'?'<span class="dot"></span>':''}${text}</span>`;}
function member(id){return `<button class="member-btn" data-person="${id}" aria-label="View ${people[id].name}'s profile">${avatar(id,true)}<span class="member-name">${people[id].name}</span></button>`;}
function msg(id,time,body){const p=people[id];return `<article class="message">${avatar(id)}<div class="message-body"><div class="message-head">${p?`<button class="person" data-person="${id}">${p.name}</button><span class="role-label" aria-label="${p.role}, AI engineer" title="AI engineer">${p.role}</span>`:'<strong>Brayden</strong>'}<time>${time}</time></div>${body}</div></article>`;}
function resultCard(){return `<div class="result"><div class="result-top"><span class="result-icon">${icon('branch')}</span><strong>Session expiry, without surprises</strong><span class="spacer"></span>${tag('Complete','ready')}</div><div class="result-body"><p>Expired sessions are rejected consistently. The regression case now covers the exact expiry boundary.</p><div class="result-evidence"><span>${icon('file')}3 files changed</span><span>${icon('check')}18 checks passed</span><span>${icon('people')}Reviewed by Oren</span><button class="text-btn" data-detail="pr">PR #42 · Open</button></div></div><div class="result-footer"><span>Atlas</span><span>·</span><span>Office mini</span><span class="spacer"></span><button class="text-btn" data-detail="expiry">Inspect the work&nbsp; →</button></div></div>`;}

function roomMessages(view){
if(view==='security')return msg('you','10:14',`<p><span class="mention">@Mira</span> can you fix Atlas accepting expired sessions?</p>`)+msg('mira','10:18',`<p>The refresh path was skipping expiry validation. I've added the check and opened PR #42.</p><p><span class="mention">@Oren</span> can you review it? I'd like a second look at the exact expiry boundary and refresh behaviour.</p><button class="thread-link" data-detail="pr">${icon('branch')}PR #42 · Fix session expiry</button>`)+msg('oren','10:22',`<p>One change before this goes in: the refresh handler still accepts a token at the exact expiry instant. Please use the shared validator there and add a regression test.</p><button class="thread-link" data-detail="review">${icon('file')}Changes requested · refresh.go:42</button>`)+msg('mira','10:25',`<p>Good catch. Refresh now uses the shared validator, and the new regression passes. All 18 checks are green.</p><p><span class="mention">@Oren</span> ready for another look.</p>`)+msg('oren','10:28',`<p>Checked the updated diff and the boundary test. The refresh path now rejects the token at expiry, and the client retry still works. Approved.</p><button class="thread-link" data-detail="review">${icon('check')}View review · approved updated revision</button>`)+msg('mira','10:29',`<p>Fixed and reviewed. We kept the established expiry behaviour. PR #42 is open, with the patch and checks attached.</p>${resultCard()}`);
if(view==='engineering')return msg('you','10:32',`<p>How are Atlas and Beacon looking? Just the useful version.</p>`)+msg('mira','10:33',`<p><strong>Atlas:</strong> the session expiry fix is complete. Oren reviewed it in Security and all 18 checks pass. We kept the established expiry behaviour.</p>${resultCard()}`)+msg('pip','10:34',`<p><strong>Beacon:</strong> I've traced the gateway through the queue producer. The retry worker lives outside the linked repositories; I asked where to find it in Reverse engineering. I'm continuing the gateway's duplicate-request checks meanwhile.</p><button class="thread-link" data-detail="beacon">Open the investigation ${icon('arrow')}</button>`)+`<div class="notice">${icon('info')}<p>Mira is the same engineer you work with in Security. Work and decisions stay linked to their original conversations.</p></div>`;
return msg('you','09:32',`<p><span class="mention">@Pip</span> can you work out how Beacon retries requests? I want to understand where a duplicate write could happen.</p>`)+msg('pip','09:35',`<p>I'll trace the gateway, queue, and retry worker, then map which parts are safe to repeat.</p>`)+msg('pip','10:20',`<p>The gateway creates a request ID and passes it to the queue. I'm checking whether repeat requests keep that ID.</p><div class="result"><div class="result-top"><span class="result-icon">${icon('project')}</span><strong>Beacon gateway map</strong>${tag('In progress')}</div><div class="result-body"><p>Gateway → request ID → queue producer</p><div class="result-evidence"><span>${icon('file')}2 source locations</span><span>${icon('machine')}Lounge mini</span></div></div><div class="result-footer"><span>Owner · Pip</span><span class="spacer"></span><button class="text-btn" data-detail="beacon">See the investigation →</button></div></div>`)+msg('pip','10:23',`<p><span class="mention">@Brayden</span> which repository contains Beacon’s retry worker? I checked the linked repos and setup docs, but only found the gateway and queue producer.</p><p>I'm continuing the gateway deduplication map while I track that down.</p>`);
}
function renderRoom(){const r=rooms[state.view];const local=(state.messages[state.view]||[]).map(text=>`<div class="local-message">${msg('you','Just now',`<p>${esc(text).replace(/\n/g,'<br>')}</p><p class="small-label">Saved in this demo until reload. No agent is connected.</p>`)}</div>`).join('');return `<header class="main-header"><div><h1><span class="header-label">#</span> ${r.name}</h1><p>${r.subtitle}</p></div><div class="members">${r.people.map(member).join('')}</div></header><div class="main-scroll" id="messageScroll"><div class="room-layout"><div class="work-strip">${icon('branch')}<strong>${state.view==='reverse'?'Tracing Beacon requests':state.view==='engineering'?'2 pieces of work, one place to catch up':'Atlas · session expiry'}</strong><span class="spacer"></span>${state.view==='security'?tag('Complete','ready'):tag('Work is moving','ready')}<button class="text-btn" data-detail="${state.view==='reverse'?'beacon':'expiry'}">View work →</button></div><div class="day-divider">Today, 25 September</div>${roomMessages(state.view)}${local}</div></div><div class="composer-wrap"><form class="composer" id="composer"><label class="sr-only" for="messageInput">Message ${r.name}</label><textarea id="messageInput" rows="2" placeholder="Message ${r.name}…">${esc(state.drafts[state.view]||'')}</textarea><div class="composer-bottom"><span class="context">${icon('project')}${r.project}</span><span class="spacer"></span><span class="small-label">Sample message</span><button type="submit" class="send" aria-label="Add sample message">${icon('up')}</button></div></form><p class="composer-help">Concept only · no agents connected · ⌘ / Ctrl + Enter to add a sample</p></div>`;}
function page(title,desc,content,eyebrow='Your workspace'){return `<div class="main-scroll"><div class="page"><div class="page-intro"><span class="eyebrow muted">${eyebrow}</span><h1>${title}</h1><p>${desc}</p></div>${content}</div></div>`;}
function jobRow(id,owner,title,sub,status,type=''){return `<button class="job-row" data-detail="${id}">${avatar(owner)}<span class="job-copy"><strong>${title}</strong><p>${sub}</p></span>${tag(status,type)}${icon('arrow')}</button>`;}
function overview(){return page('Your team has the thread.','Pick up the conversation. Here is what finished and what is moving.',`<div class="welcome-grid"><section class="feature-block"><div class="row">${tag('Completed','ready')}</div><h2>Atlas expiry is fixed.</h2><p>Mira preserved the existing behaviour, Oren reviewed the patch, and all 18 checks passed.</p><button class="button primary" data-detail="expiry">Inspect the work ${icon('arrow')}</button></section><section class="feature-block"><div class="row"><div class="avatar-stack">${avatar('mira',true)}${avatar('oren',true)}${avatar('pip',true)}</div><span class="small-label">Your engineers</span></div><h2>Same people. Shared progress.</h2><p>Three engineers, two projects, and a conversation that carries on when you close the laptop.</p><button class="button" data-view="engineers">Meet your team ${icon('arrow')}</button></section></div><div class="section-heading"><h2>Across your projects</h2><span class="small-label">Latest work</span></div><div class="job-list">${jobRow('expiry','mira','Fix Atlas session expiry','Security · reviewed by Oren · Office mini','Complete','ready')}${jobRow('beacon','pip','Understand Beacon’s retry path','Reverse engineering · mapping the gateway · Lounge mini','In progress')}</div><div class="section-heading"><h2>From the conversation</h2></div><div class="notice" style="margin-top:0">${avatar('pip',true)}<div><p><strong>Pip is tracing Beacon’s gateway.</strong> He asked where the separate retry-worker repo lives and is continuing the duplicate-request checks.</p><button class="text-btn" data-view="reverse">Open Reverse engineering →</button></div></div><div class="section-heading"><h2>Worth remembering</h2></div><div class="notice" style="margin-top:0">${icon('file')}<div><p><strong>Atlas uses server-side expiry checks.</strong></p><p class="muted">Established project decision · linked to its source in Security</p><button class="text-btn" data-detail="decision">Read the decision →</button></div></div>`,'Friday, 25 September');}

function engineers(){return page('A team you get to know.','Bring the same engineers into different rooms. Their role stays familiar; the context they use stays scoped.',`<div class="people-grid">${Object.entries(people).map(([id,p])=>`<button class="person-card" data-person="${id}"><span class="avatar large ${id}">${p.letter}</span><div><h2>${p.name}</h2><span class="small-label">${p.role}</span></div><p>${p.desc}</p>${tag(p.rooms.length+' '+(p.rooms.length===1?'room':'rooms'))}</button>`).join('')}</div><div class="notice">${icon('info')}<p>Each engineer has a persistent identity. Provider sessions, permissions, and project work are separate, so joining another room does not expose private context.</p></div>`);}
function projects(){return page('Two projects. One conversation away.','Projects hold source access, work, and decisions. Rooms can talk about more than one.',`<div class="welcome-grid"><section class="feature-block"><div class="row">${icon('project')}<span class="spacer"></span><span class="project-count">01</span></div><h2>Atlas</h2><p>Identity and session services.<br>Available in Engineering and Security.</p>${tag('1 completed fix','ready')}<div class="divider"></div><button class="text-btn" data-detail="expiry">Inspect the expiry fix →</button></section><section class="feature-block"><div class="row">${icon('project')}<span class="spacer"></span><span class="project-count">02</span></div><h2>Beacon</h2><p>Request gateway and background workers.<br>Available in Engineering and Reverse engineering.</p>${tag('1 investigation running')}<div class="divider"></div><button class="text-btn" data-detail="beacon">Follow the request trace →</button></section></div><div class="notice">${icon('branch')}<p>Every code job uses its own worktree. Reviews refer to an exact revision, so “looks good” applies to the change you actually inspected.</p></div>`);}
function machines(){return page('Leave the work here.','Your laptop is a window into the workspace. These machines hold the hub and run the work.',`<section class="machine-card"><div class="machine-picture">${icon('machine')}</div><div class="machine-info"><div class="row"><h2>Office mini</h2>${tag('Connected','ready')}<span class="spacer"></span><span class="small-label">Hub + runner</span></div><p>Mac mini · macOS · trusted native execution</p><div class="machine-meta"><div><span>Doing now</span><strong>Atlas fix complete</strong></div><div><span>Available providers</span><strong>Codex · Claude Code</strong></div><div><span>Last contact</span><strong>Just now · sample</strong></div></div></div></section><section class="machine-card"><div class="machine-picture">${icon('machine')}</div><div class="machine-info"><div class="row"><h2>Lounge mini</h2>${tag(state.offline?'Reconnecting':'Connected',state.offline?'attention':'ready')}<span class="spacer"></span><span class="small-label">Runner</span></div><p>Mac mini · macOS · trusted native execution</p><div class="machine-meta"><div><span>Doing now</span><strong>${state.offline?'Beacon outcome unconfirmed':'Tracing Beacon requests'}</strong></div><div><span>Available provider</span><strong>Cursor</strong></div></div><div class="divider"></div><button class="button" data-action="connection">${icon('refresh')}${state.offline?'Restore sample connection':'Simulate a lost connection'}</button></div></section>${state.offline?`<div class="notice">${icon('info')}<p><strong>We have lost contact with Lounge mini.</strong> The sample job is not reassigned while its outcome is unknown. Reconnect and reconcile before starting more work.</p></div>`:`<div class="notice">${icon('check')}<p>Closing this client would not stop remote work in the finished product. This concept illustrates that state; it does not run background jobs.</p></div>`}`);}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{if(b.closest('nav'))b.toggleAttribute('aria-current',false)});document.querySelector(`nav [data-view="${state.view}"]`)?.setAttribute('aria-current','page');$('#machineSummary').textContent=state.offline?'1 machine reconnecting':'2 machines connected';$('#main').innerHTML=rooms[state.view]?renderRoom():({overview,engineers,projects,machines}[state.view])();$('#announcer').textContent=rooms[state.view]?.name||({overview:'Overview',engineers:'Engineers',projects:'Projects',machines:'Machines'}[state.view]);if(rooms[state.view])$('#messageScroll').scrollTop=$('#messageScroll').scrollHeight;}
function navigate(view){if(!rooms[view]&&!['overview','engineers','projects','machines'].includes(view))return;state.view=view;closeMobile();if($('#detailDialog').open)$('#detailDialog').close();render();}
function showToast(text){clearTimeout(showToast.timer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');showToast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4500);}
function closeMobile(){const wasOpen=$('#sidebar').classList.contains('open');$('#sidebar').classList.remove('open');$('#mobileScrim').classList.add('hidden');$('#mobileMenu').setAttribute('aria-expanded','false');if(wasOpen)$('#mobileMenu').focus();}
function toggleMobile(){const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#mobileScrim').classList.toggle('hidden',!open);$('#mobileMenu').setAttribute('aria-expanded',String(open));if(open)$('#mobileClose').focus();}
function drawerShell(kicker,title,body,footer='Illustrative data · no connected agents'){return `<header class="drawer-head"><div class="row"><span class="eyebrow muted">${kicker}</span><span class="spacer"></span><button class="icon-btn" data-action="close-detail" aria-label="Close detail">${icon('close')}</button></div><h2 id="detailTitle">${title}</h2></header><div class="drawer-body">${body}</div><footer class="drawer-footer">${footer}</footer>`;}
function renderDetail(){let html='';const id=state.detail;
if(id==='expiry'){const evidence=`<span class="eyebrow muted">Patch excerpt</span><div class="code-block"><span class="muted">session/validate.go · sample</span><br><span class="removed">− if validSignature(token) {</span><br><span class="added">+ if validSignature(token) &amp;&amp;</span><br><span class="added">+ &nbsp; now.Before(token.ExpiresAt) {</span></div><h3>Checks</h3><div class="check-row">${icon('check')}18 focused checks passed</div><div class="check-row">${icon('check')}Expiry boundary regression covered</div><div class="check-row">${icon('check')}Oren approved the updated revision</div><div class="divider"></div><h3>Review note</h3><p class="muted" style="margin-top:8px">“Refresh now uses the shared validator. I rechecked the exact expiry boundary and the client retry. Approved.”</p><button class="thread-link" data-detail="review">Read Oren’s review →</button><div class="divider"></div><p class="fineprint">This is an illustrative code excerpt, not a real repository diff. No branch has been merged.</p>`;const activity=`<ol class="activity"><li><strong>Brayden asked Mira to fix session expiry</strong><time>10:14 · Security</time></li><li><strong>Mira requested Oren’s review of PR #42</strong><time>10:18 · First revision demo-a71e01</time></li><li><strong>Oren found an expiry-boundary defect</strong><time>10:22 · Changes requested</time></li><li><strong>Mira fixed refresh and requested re-review</strong><time>10:25 · Updated revision demo-a71f02 · 18 checks pass</time></li><li><strong>Oren approved the updated revision</strong><time>10:28 · Boundary and retry verified</time></li><li><strong>Mira completed the patch</strong><time>10:29 · PR remains open</time></li></ol>`;html=drawerShell('Atlas · work','Fix session expiry',`<dl class="detail-grid"><dt>Owner</dt><dd class="row">${avatar('mira',true)}Mira</dd><dt>Review</dt><dd>Oren · approved</dd><dt>Pull request</dt><dd><button class="text-btn" data-detail="pr">#42 · Open</button></dd><dt>Machine</dt><dd>Office mini</dd><dt>Revision</dt><dd><code>demo-a71f02</code></dd><dt>Status</dt><dd>${tag('Complete','ready')}</dd></dl><div class="tabs" role="tablist" aria-label="Work detail"><button class="tab" role="tab" data-tab="evidence" aria-selected="${state.detailTab==='evidence'}">Evidence</button><button class="tab" role="tab" data-tab="activity" aria-selected="${state.detailTab==='activity'}">Activity</button></div><div role="tabpanel">${state.detailTab==='evidence'?evidence:activity}</div>`);}
else if(id==='review')html=drawerShell('Peer review · PR #42','Reviewed, revised, approved.',`<div class="row">${avatar('oren')}<div><h3>Oren</h3><p class="small-label">Security engineer</p></div><span class="spacer"></span>${tag('Approved','ready')}</div><div class="divider"></div><dl class="detail-grid"><dt>Author</dt><dd>Mira</dd><dt>Reviewed revision</dt><dd><code>demo-a71f02</code></dd><dt>Scope</dt><dd>Expiry boundary and client retry</dd></dl><h3>Review conversation</h3><ol class="activity" style="margin-top:18px"><li><strong>Oren requested a change</strong><time>10:22 · demo-a71e01 · refresh.go:42</time><p>The refresh handler accepts the token at the exact expiry instant. Use the shared validator and add a regression test.</p><div class="code-block">// First revision — boundary is still accepted<br>return !now.After(token.ExpiresAt)</div></li><li><strong>Mira addressed the finding</strong><time>10:25 · demo-a71f02</time><p>Refresh now calls the shared validator. Added the exact-boundary regression; all 18 checks pass. Requested another review.</p></li><li><strong>Oren verified the fix and approved</strong><time>10:28 · demo-a71f02</time><p>I checked the updated diff and reran the boundary test. The finding is resolved; the client retry still works.</p></li></ol><div class="divider"></div><p class="fineprint">Illustrative internal peer review. Approval applies to this revision. The sample PR remains open; no GitHub review or merge has occurred.</p><button class="thread-link" data-detail="pr">View pull request</button>`);
else if(id==='pr')html=drawerShell('Atlas · sample pull request','#42 Fix session expiry',`<div class="row">${tag('Open')}${tag('Peer review approved','ready')}</div><div class="divider"></div><dl class="detail-grid"><dt>Author</dt><dd>Mira</dd><dt>Reviewer</dt><dd>Oren</dd><dt>Revision</dt><dd><code>demo-a71f02</code></dd><dt>Changed files</dt><dd>3</dd><dt>Checks</dt><dd>18 focused checks passed · sample</dd><dt>Merge state</dt><dd>Not merged</dd></dl><h3>What changed</h3><p class="muted" style="margin-top:8px">Refresh now uses the same strict-expiry validator as the normal session path. A regression covers the exact expiry instant.</p><div class="divider"></div><h3>Review</h3><p class="muted" style="margin-top:8px">Oren found a boundary defect in the first revision. Mira fixed it, requested another review, and Oren approved the updated patch.</p><button class="thread-link" data-detail="review">View review and revisions</button><br><button class="thread-link" data-detail="expiry">Inspect diff and checks</button><div class="divider"></div><p class="fineprint">Sample PR, local demonstration only. This is not a live GitHub URL and internal peer approval does not establish remote merge eligibility.</p><button class="thread-link" data-view="security">Open Security conversation</button>`);
else if(id==='beacon')html=drawerShell('Beacon · investigation','Follow the retry path',`<dl class="detail-grid"><dt>Owner</dt><dd class="row">${avatar('pip',true)}Pip</dd><dt>Machine</dt><dd>Lounge mini</dd><dt>Status</dt><dd>${tag(state.offline?'Outcome unconfirmed':'In progress',state.offline?'attention':'')}</dd><dt>Last action</dt><dd>Inspect gateway request-ID handling</dd></dl><h3>What Pip has found</h3><p class="muted" style="margin-top:8px">The gateway assigns a request ID before enqueueing. Pip is checking repeat requests here; tracing the separate worker depends on locating its repository. Pip asked in Reverse engineering after checking the linked repos and setup docs.</p><div class="code-block">gateway<br>&nbsp; ↓ request ID<br>queue producer<br>&nbsp; ↓<br>retry worker · repository not yet located</div><h3>Next confirmed scope</h3><p class="muted" style="margin-top:8px">Continue gateway duplicate-request analysis and document source locations. Resume the worker trace once its repository is identified. No code edits were requested.</p><button class="thread-link" data-view="reverse">Open the conversation →</button>`);
else if(id==='decision')html=drawerShell('Atlas · accepted decision','Expiry belongs on the server.',`<p>The server is responsible for rejecting expired sessions. Client-side checks are helpful for experience but cannot establish validity.</p><div class="divider"></div><dl class="detail-grid"><dt>Scope</dt><dd>Atlas project</dd><dt>Source</dt><dd>Security · session discussion</dd><dt>Accepted by</dt><dd>Brayden</dd><dt>Used by</dt><dd>Mira’s session expiry fix</dd></dl><p class="fineprint">A saved decision carries its source and scope. Adding Mira to another room does not automatically reveal private source material there.</p><button class="thread-link" data-detail="expiry">View linked work →</button>`);
else if(id?.startsWith('person:')){const key=id.split(':')[1],p=people[key];html=drawerShell('Your engineer',p.name,`<div class="row"><span class="avatar large ${key}">${p.letter}</span><div><h3>${p.role}</h3><span class="small-label">AI engineer · ${p.provider}</span></div></div><p class="muted" style="margin-top:18px">${p.desc}</p><div class="divider"></div><dl class="detail-grid"><dt>Current work</dt><dd>${p.status}</dd><dt>Available in</dt><dd>${p.rooms.join('<br>')}</dd><dt>Identity</dt><dd>One engineer across these rooms</dd></dl><h3>How continuity works</h3><p class="muted" style="margin-top:8px">Relevant project facts and accepted decisions come with their sources. Work gets its own scoped context and permissions.</p><div class="notice">${icon('info')}<p>This profile illustrates a persistent agent identity. It is not a real person or an active process.</p></div>`);}
else html=drawerShell('Design concept','Your AI team, together.',`<img src="assets/yip-icon.svg" width="72" height="72" alt="yip branching y icon" style="margin-bottom:20px"><p>yip is a proposal for a personal, self-hosted workspace with persistent AI engineers and work running on your machines.</p><div class="divider"></div><h3>Try the idea</h3><p class="muted" style="margin-top:8px">Switch rooms, inspect a result, follow a peer review through changes and approval, see a genuine question in the group chat, explore your engineers, or simulate a lost machine connection. Search and night appearance work too.</p><div class="divider"></div><p class="fineprint">All people, projects, messages, results, and machine states are illustrative. Sample messages remain only in this page until reload. This file makes no network requests. The visual concept does not implement the agent harness.</p><p class="fineprint" style="margin-top:12px">yip is the chosen working name. The prototype uses the new branching y mark. Native fonts keep this concept usable offline.</p><p style="margin-top:18px"><a href="README.md">Read the implementation handoff</a></p>`);

function openDetail(id){closeMobile();state.detail=id;state.detailTab='evidence';renderDetail();if(!$('#detailDialog').open)$('#detailDialog').showModal();else $('#detailDialog').querySelector('[data-action="close-detail"]').focus();}
const searchable=[{title:'Security',sub:'Room · Mira and Oren',view:'security',type:'people'},{title:'Engineering',sub:'Room · Mira and Pip',view:'engineering',type:'people'},{title:'Reverse engineering',sub:'Room · Pip',view:'reverse',type:'people'},{title:'Fix Atlas session expiry',sub:'Work · Mira · complete',detail:'expiry',type:'branch'},{title:'PR #42 — Fix session expiry',sub:'Sample pull request · Open · peer review approved',detail:'pr',type:'branch'},{title:'Beacon request flow',sub:'Investigation · Pip',detail:'beacon',type:'project'},...Object.entries(people).map(([id,p])=>({title:p.name,sub:p.role,detail:'person:'+id,type:'people'})),{title:'Machines',sub:'Office mini and Lounge mini',view:'machines',type:'machine'},{title:'Server-side expiry checks',sub:'Accepted project decision · Atlas',detail:'decision',type:'file'}];
function search(){const q=$('#searchInput').value.toLowerCase().trim();const rows=searchable.filter(x=>(x.title+' '+x.sub).toLowerCase().includes(q));$('#searchResults').innerHTML=rows.length?rows.map(x=>`<button class="search-result" data-search-view="${x.view||''}" data-search-detail="${x.detail||''}">${icon(x.type)}<span><strong>${x.title}</strong><small>${x.sub}</small></span></button>`).join(''):'<p class="empty">No matches in the sample workspace.</p>';}
function openSearch(){closeMobile();if($('#detailDialog').open)$('#detailDialog').close();$('#searchDialog').showModal();$('#searchInput').value='';search();$('#searchInput').focus();}
function submitSample(){const input=$('#messageInput'),text=input?.value.trim();if(!text)return;const view=state.view;(state.messages[view]??=[]).push(text);state.drafts[view]='';render();$('#messageScroll').scrollTop=$('#messageScroll').scrollHeight;$('#messageInput').focus();showToast('Sample added locally. No agent was contacted.');}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.person){openDetail('person:'+b.dataset.person);return;}if(b.dataset.detail){openDetail(b.dataset.detail);return;}if(b.dataset.tab){state.detailTab=b.dataset.tab;renderDetail();$('#detailDialog').querySelector(`[data-tab="${state.detailTab}"]`).focus();return;}if('searchView' in b.dataset){$('#searchDialog').close();if(b.dataset.searchView)navigate(b.dataset.searchView);else openDetail(b.dataset.searchDetail);return;}if(b.dataset.action==='about')openDetail('about');if(b.dataset.action==='close-detail')$('#detailDialog').close();if(b.dataset.action==='close-search')$('#searchDialog').close();if(b.dataset.action==='connection'){state.offline=!state.offline;render();showToast(state.offline?'Sample connection lost. The job is marked unconfirmed.':'Sample reconnected. Runner state reconciled.');}});
document.addEventListener('submit',event=>{if(event.target.id==='composer'){event.preventDefault();submitSample();}});
document.addEventListener('input',event=>{if(event.target.id==='messageInput')state.drafts[state.view]=event.target.value;});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();}if((event.metaKey||event.ctrlKey)&&event.key==='Enter'&&event.target.id==='messageInput'){event.preventDefault();submitSample();}if(event.key==='Escape')closeMobile();if(event.key==='Tab'&&$('#sidebar').classList.contains('open')){const items=[...$('#sidebar').querySelectorAll('button')].filter(e=>e.getClientRects().length);const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}if(event.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();state.detailTab=state.detailTab==='evidence'?'activity':'evidence';renderDetail();$('#detailDialog').querySelector(`[data-tab="${state.detailTab}"]`).focus();}});
$('#searchInput').addEventListener('input',search);$('#searchLaunch').addEventListener('click',openSearch);$('#mobileMenu').addEventListener('click',toggleMobile);$('#mobileClose').addEventListener('click',closeMobile);$('#mobileScrim').addEventListener('click',closeMobile);
$('#themeButton').addEventListener('click',()=>{state.theme=state.theme==='day'?'night':'day';document.documentElement.dataset.theme=state.theme;$('#themeButton').innerHTML=icon(state.theme==='day'?'moon':'sun');$('#themeButton').setAttribute('aria-label',`Switch to ${state.theme==='day'?'night':'day'} appearance`);});
render();
</script>
