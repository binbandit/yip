# Vite serves the frontend in development; Air rebuilds only the Go backend.
root = "."
tmp_dir = "bin/dev"
env_files = []

[build]
cmd = "go build -o ./bin/dev/yip ./cmd/yip"
entrypoint = ["./bin/dev/yip", "hub", "--data", ".yip/dev", "--listen", "127.0.0.1:7521", "--runner-listen", "127.0.0.1:7543", "--runner-url", "https://127.0.0.1:7543"]
include_dir = ["cmd", "internal", "protocol", "web"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["bin", ".yip", "web/node_modules", "web/dist"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
# Air v1.67.4 stops waiting after five seconds. Force a slow hub to exit
# before that deadline so restarts and supervisor shutdown cannot orphan it.
send_interrupt = true
kill_delay = "2s"

[screen]
clear_on_rebuild = false
